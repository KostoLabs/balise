name: balise

networks:
  edge:
    name: dev-ovh_koordo
    external: true

services:
  back:
    build:
      context: ..
      dockerfile: docker/Dockerfile.back
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:?set MISTRAL_API_KEY in .env}
      - CHAT_MODEL=${CHAT_MODEL:-mistral-medium-latest}
    restart: unless-stopped
    networks: [edge]

  front:
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
    # Pas de ports publiés : exposé via le Caddy de la VM (balise.kostolabs.ai)
    depends_on:
      - back
    restart: unless-stopped
    networks:
      edge:
        aliases: [balise-front]